<div class="control-section">
    <ejs-grid [dataSource]='data' 
              [enableDomVirtualization]="true"
              [domVirtualizationSettings]="domVirtualizationSettings"
              [allowSorting]='true'
              [allowFiltering]='true'
              [toolbar]='toolbar'
              height="300px">
        <e-columns>
            <e-column field='OrderID' headerText='Order ID' width='120' isPrimaryKey='true'></e-column>
            <e-column field='CustomerName' headerText='Customer Name' width='150'></e-column>
            <e-column field='TotalAmount' headerText='Total Amount' width='150' format='C2' textAlign='Right'></e-column>
            <e-column field='ShipCity' headerText='Ship City' width='150'></e-column>
            <e-column field='Status' headerText='Status' width='120'></e-column>
        </e-columns>
    </ejs-grid>
</div>
