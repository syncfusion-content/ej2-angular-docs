<!DOCTYPE html>
<html lang="en">

<head>
    <title>EJ2 Gantt</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Typescript UI Controls" />

    <meta name="author" content="Syncfusion" />
    <link href="index.css" rel="stylesheet" />
    <style>
        .e-split-bar,
        .e-headercell {
            background: #add8e6 !important;
            /* Set splitter and header cell background color */
        }

        .e-timeline-header-container,
        .e-weekend-header-cell {
            background: #add8e6 !important;
            /* Set timeline header and weekend cell background color */
        }

        .e-gantt-parent-taskbar-inner-div {
            background-color: #7ab748 !important;
            /* Set parent taskbar color */
        }

        .e-gantt-parent-progressbar-inner-div {
            background-color: #4b732a !important;
            /* Set parent progress bar color */
        }

        .e-gantt-milestone {
            background-color: #ad7a66 !important;
            /* Set milestone color */
        }

        .e-gantt-child-taskbar-inner-div {
            background-color: #6d619b !important;
            /* Set child taskbar color */
        }

        .e-gantt-child-progressbar-inner-div {
            background-color: #4e466e !important;
            /* Set child progress bar color */
        }

        .e-tooltip-wrap {
            background: #a9e0f4 !important;
            /* Set tooltip background color */
        }

        .e-event-markers {
            border-left-color: #05088f !important;
            /* Set event marker color */
        }

        .e-event-markers .e-span-label {
            background-color: #f3e5f5 !important;
            /* Set event marker label background color */
            color: #6a1b9a !important;
            /* Set event marker label text color */
        }

        .e-baseline-gantt-milestone-container {
            background-color: #fdb9c9 !important;
            /* Set baseline milestone color */
        }

        .e-baseline-bar {
            background-color: #fdb9c9 !important;
            /* Set baseline bar color */
        }

        .e-label {
            color: #1e74ca !important;
            /* Set label text color */
        }

        .e-connector-line {
            stroke: #ab6060fc !important;
            /* Set line color */
        }

        .e-connector-line-arrow {
            fill: #ab6060fc !important;
            /* Set arrow color */
        }
    </style>
</head>

<body style="margin: 125px; width: 800px; height: 100%;">
    <app-root>
        <div id='loader'>Loading....</div>
    </app-root>
</body>

</html>
